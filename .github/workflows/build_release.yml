name: Build & Release Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK & App Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload APK Artifact to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: mpsc-abhyas-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB Artifact to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: mpsc-abhyas-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Create Automatic GitHub Release on Tag or Main Push
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name == 'main' && format('v1.0.{0}', github.run_number) || github.ref_name }}
          name: ${{ format('MPSC ABHYAS Release {0}', github.ref_name == 'main' && format('v1.0.{0}', github.run_number) || github.ref_name) }}
          body: |
            ## 🚀 MPSC ABHYAS Official Release
            
            This automated release was generated by GitHub Actions.
            
            ### 📦 Download Assets:
            - **Release APK**: Download `app-release-unsigned.apk` below for direct installation.
            - **Play Store Bundle (AAB)**: Download `app-release.aab` for Google Play Store Console upload.
            
            ---
            *Built automatically via CI/CD Workflow.*
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
