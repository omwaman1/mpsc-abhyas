# Project-wide Gradle settings for ULTRA-FAST Android Studio builds.

# Keep Gradle Daemon alive in background memory
org.gradle.daemon=true

# Allocate 4GB JVM RAM + G1GC for smooth fast compilation without memory thrashing
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# Parallel execution & aggressive build caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin incremental compilation & daemon optimization
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseG1GC

# Android Gradle Plugin performance & R class optimization
android.nonTransitiveRClass=true
kapt.incremental.apt=true
ksp.incremental=true

# Fast worker execution limit
org.gradle.workers.max=8

# Allow google-services missing passthrough
googleServices.missing.passthrough=true
